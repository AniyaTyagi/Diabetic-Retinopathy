services:
  - type: web
    name: netrax-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "https://netrax-indol.vercel.app,http://localhost:5173"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:///./netrax.db"
